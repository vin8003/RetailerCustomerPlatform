name: e2e

# Playwright journeys (OE-367/368/369) against a throwaway local stack:
# Postgres service + Django runserver + both Next.js apps as production static builds
# (API/media base from NEXT_PUBLIC_API_BASE_URL; "Bundle guard" fails the run if a build still names a live host).
# Nothing here points at a live OrderEasy host; guard.spec.ts (G3) checks this file.
# Full suite on push to main and nightly; PRs run only the areas they touch (see "Pick test areas").
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *' # 03:00 IST
  workflow_call:
    inputs:
      area:
        description: test area tag(s) to run, e.g. retailer or customer (FE PRs pass their app); empty = full suite
        type: string
        default: ''
      retailer_ref:
        description: retailer_ordereasy_njs ref to test (FE PRs pass their head ref)
        type: string
        default: ''
      customer_ref:
        description: customer_ordereasy_njs ref to test (FE PRs pass their head ref)
        type: string
        default: ''
      rcp_ref:
        description: RetailerCustomerPlatform ref to test when called from an FE repo (default main)
        type: string
        default: ''
    secrets:
      E2E_REPO_TOKEN:
        description: optional read token for the app repos (only needed if they are private)
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oe_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: ordering_platform.settings_e2e
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: oe_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      E2E_API_ORIGIN: http://127.0.0.1:8100
      E2E_API_URL: http://127.0.0.1:8100/api/
      E2E_RETAILER_URL: http://127.0.0.1:4273
      E2E_CUSTOMER_URL: http://127.0.0.1:4276
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8100/api/
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8100
      NEXT_PUBLIC_RETAILER_PORTAL_URL: http://127.0.0.1:4273
      # Dummy, non-secret Firebase config so the SDK initialises offline; Playwright aborts all Google traffic.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyE2E-dummy-key-not-real-000000000
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: e2e-dummy.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: e2e-dummy
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: e2e-dummy.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:e2e'
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: e2e-dummy
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout RetailerCustomerPlatform
        uses: actions/checkout@v4
        with:
          repository: vin8003/RetailerCustomerPlatform
          # Called from an FE repo: use RCP main (or rcp_ref, to test an unmerged RCP branch). Run in RCP itself: use the commit under test.
          ref: ${{ github.repository == 'vin8003/RetailerCustomerPlatform' && github.sha || inputs.rcp_ref || 'main' }}
          token: ${{ github.repository == 'vin8003/RetailerCustomerPlatform' && github.token || secrets.E2E_REPO_TOKEN || github.token }}
          path: rcp
          persist-credentials: false

      # Paired PRs: on an RCP pull_request, use the FE branch with the same name as the RCP head branch
      # if it exists, else main. workflow_call inputs (FE-repo PRs) always win.
      - name: Pick FE refs (same-named branch, else main)
        id: fe
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          RETAILER_INPUT: ${{ inputs.retailer_ref }}
          CUSTOMER_INPUT: ${{ inputs.customer_ref }}
        run: |
          pick() {
            if [ -n "$2" ]; then echo "$2"; return; fi
            if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$HEAD_BRANCH" ] \
               && git ls-remote --exit-code --heads "https://github.com/vin8003/$1.git" "$HEAD_BRANCH" > /dev/null; then
              echo "$HEAD_BRANCH"; return
            fi
            echo main
          }
          echo "retailer=$(pick retailer_ordereasy_njs "$RETAILER_INPUT")" | tee -a "$GITHUB_OUTPUT"
          echo "customer=$(pick customer_ordereasy_njs "$CUSTOMER_INPUT")" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout retailer app
        uses: actions/checkout@v4
        with:
          repository: vin8003/retailer_ordereasy_njs
          ref: ${{ steps.fe.outputs.retailer }}
          token: ${{ secrets.E2E_REPO_TOKEN || github.token }}
          path: retailer
          persist-credentials: false

      - name: Checkout customer app
        uses: actions/checkout@v4
        with:
          repository: vin8003/customer_ordereasy_njs
          ref: ${{ steps.fe.outputs.customer }}
          token: ${{ secrets.E2E_REPO_TOKEN || github.token }}
          path: customer
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rcp/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            retailer/package-lock.json
            customer/package-lock.json
            rcp/e2e/package-lock.json

      - name: Install backend
        working-directory: rcp
        run: pip install -r requirements.txt

      - name: Migrate and seed
        working-directory: rcp
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e

      - name: Start API on :8100
        working-directory: rcp
        run: nohup python manage.py runserver 127.0.0.1:8100 --noreload > ../api.log 2>&1 &

      - name: Build retailer app
        working-directory: retailer
        run: npm ci && npm run build

      - name: Build customer app
        working-directory: customer
        run: npm ci && npm run build

      # Built bundles must not mention a live OrderEasy host at all. Exceptions are exact whole host tokens in
      # rcp/e2e/bundle-guard-allow.txt (product copy only; keep it short and reviewed).
      - name: Bundle guard (no live host in the builds)
        run: |
          test -f retailer/out/index.html && test -f customer/out/index.html
          allow=rcp/e2e/bundle-guard-allow.txt
          hits=$(grep -rEoh '[(]?([A-Za-z0-9-]+[.])*ordereasy[.]win(@gmail[.]com|[)])?' retailer/out customer/out | sort -u | grep -vxF -f <(grep -v '^\s*\(#\|$\)' "$allow") || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::a build mentions a live OrderEasy host"; exit 1; fi

      - name: Serve the builds on :4273 and :4276
        run: |
          npm install -g serve@14.2.6
          nohup serve retailer/out -l tcp://127.0.0.1:4273 > retailer.log 2>&1 &
          nohup serve customer/out -l tcp://127.0.0.1:4276 > customer.log 2>&1 &

      - name: Install Playwright
        working-directory: rcp/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for the stack
        run: |
          for url in http://127.0.0.1:8100/api/ http://127.0.0.1:4273/login http://127.0.0.1:4276/login; do
            for i in $(seq 1 120); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then echo "$url up ($code)"; break; fi
              if [ "$i" = 120 ]; then echo "$url never came up"; exit 1; fi
              sleep 5
            done
          done

      # PR scope: FE callers pass `area`; RCP PRs map changed paths to tags. Anything else
      # (seed, settings, workflow, shared helpers, unmapped): full suite. @core (guard + seed) always runs.
      - name: Pick test areas
        id: areas
        working-directory: rcp
        env:
          AREA_INPUT: ${{ inputs.area }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tags="$AREA_INPUT"
          if [ -z "$tags" ] && [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$GITHUB_REPOSITORY" = vin8003/RetailerCustomerPlatform ]; then
            git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$BASE_SHA"
            tags=core
            for path in $(git diff --name-only "$BASE_SHA" HEAD); do
              case "$path" in
                e2e/tests/pos.spec.ts|e2e/pos.ts) tags="$tags pos" ;;
                e2e/tests/khata.spec.ts) tags="$tags khata" ;;
                e2e/tests/order.spec.ts|e2e/tests/time.spec.ts|orders/*) tags="$tags orders" ;;
                offers/*|cart/*) tags="$tags offers" ;; # fixme.spec.ts spans every area: full suite
                e2e/tests/auth-*.spec.ts|authentication/*) tags="$tags auth" ;;
                e2e/tests/guard.spec.ts|e2e/tests/seed.spec.ts|*.md|docs/*) ;;
                *) tags=""; break ;; # full suite
              esac
            done
          fi
          grep=""
          for t in $tags; do grep="${grep:-@core}|@${t#@}"; done
          echo "grep=$grep" | tee -a "$GITHUB_OUTPUT"

      - name: Playwright (chromium, headless)
        working-directory: rcp/e2e
        env:
          CI: 'true'
          GREP: ${{ steps.areas.outputs.grep }}
        run: npx playwright test ${GREP:+--grep "$GREP"}

      - name: Server logs
        if: ${{ !cancelled() }}
        run: tail -n 200 api.log retailer.log customer.log || true

      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rcp/e2e/playwright-report/
            rcp/e2e/test-results/
          retention-days: 14

